spring.application.name=tastetrail-backend
server.port=${PORT:8080}

# Load optional local configuration if present (ignored in git)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (Parameterized via environment variables for cloud deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taste_trail_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Parameterized via environment variable for cloud deployment)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Optional Frontend URL for production CORS (e.g. https://your-app.vercel.app)
frontend.url=${FRONTEND_URL:}

logging.level.org.springframework.security=INFO

spring.jpa.open-in-view=false
